[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed_evals"
version = "0.2.2"
description = "Typed evaluation and runtime guards for LLM responses and Agents using Decision Models, with opt-in calibration."
readme = "README.md"
authors = [
    { name = "Aaryan Verma" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typesafe-sdk>=0.7.0,<0.8", "pydantic>=2.12,<3", "httpx2>=2.0.0,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Author = "https://github.com/Aaryanverma"
Homepage = "https://github.com/TrustifAI/typed_evals"
Repository = "https://github.com/TrustifAI/typed_evals"
Documentation = "https://github.com/TrustifAI/typed_evals/tree/main/docs"
Issues = "https://github.com/TrustifAI/typed_evals/issues"
Changelog = "https://github.com/TrustifAI/typed_evals/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=3.26.0,<4"]
calibration = ["scikit-learn>=1.4,<2"]
langchain = ["langchain>=1,<2"]
crewai = ["crewai>=1.15.22,<2"]
agent-framework = ["agent-framework-core>=1.19,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9", "mypy>=1.15,<2", "build>=1.2"]

[project.scripts]
typed_evals = "typed_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["typed_evals", "typed_evals.*"]
namespaces = false

[tool.setuptools.package-data]
typed_evals = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in paid provider API smoke tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["typed_evals"]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# scikit-learn is optional and does not ship type information.
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Native CrewAI types are checked in its separate CI environment because its
# OpenAI dependency conflicts with the native Decisions backend's SDK version.
module = ["crewai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["typed_evals"]
branch = true

[tool.coverage.report]
show_missing = true
