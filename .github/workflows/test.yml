name: tests
on:
  push:
    # Release tags run these checks through publish.yml.
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CrewAI currently requires openai<3; exercise it in a separate environment.
      - run: python -m pip install -e '.[openai,calibration,dev,langchain,agent-framework]'
      - run: python -c "import openai, langchain, agent_framework; assert hasattr(openai.AsyncOpenAI(api_key='contract-test'), 'decisions')"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not live" --cov=typed_evals --cov-report=term-missing
      - run: python -m build
  crewai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[calibration,dev,crewai]'
      - run: python -c "import crewai"
      - run: pytest -m "not live" tests/test_crewai_adapter.py tests/test_tool_guard.py tests/test_runtime.py tests/test_evaluator.py tests/test_package.py tests/test_cli_backends.py
