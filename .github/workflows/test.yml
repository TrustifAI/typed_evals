name: tests
on:
  push:
    # Release tags run these checks through publish.yml.
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[calibration,dev,langchain,crewai,agent-framework]'
      - run: python -c "import langchain, crewai, agent_framework"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not live" --cov=typed_evals --cov-report=term-missing
      - run: python -m build
